name: 'Deploy Firebase Python Resources'
description: 'Deploy Python-based Firebase resources with environment selection'
author: 'Digital Wisdom'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  service_account_json:
    description: 'Firebase service account JSON'
    required: true
  deploy_command:
    description: 'Deploy command (e.g. "firebase deploy --only functions", "make deploy")'
    required: false
    default: 'firebase deploy --only functions'
  project_id:
    description: 'Firebase project ID (will firebase use <project_id> if specified)'
    required: false
  functions_dir:
    description: 'Directory containing functions and pyproject.toml (if requirements.txt is not present, will create with uv)'
    required: false
    default: 'functions'

runs:
  using: 'composite'
  steps:
    - name: Install build tools for make support
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Set up Node.js for Firebase CLI
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Firebase CLI
      shell: bash
      run: |
        npm install -g firebase-tools@14.19.1
        firebase --version

    - name: Install uv package manager
      uses: astral-sh/setup-uv@v5

    - name: Setup Python from pyproject.toml
      env:
        REQUIREMENTS_PATH: ${{ inputs.functions_dir }}/requirements.txt
      if: ${{ !hashFiles(env.REQUIREMENTS_PATH) }}
      shell: bash
      run: |
        cd ${{ inputs.functions_dir }}
        uv sync
        uv pip freeze > requirements.txt
        ln -s .venv venv

    - name: Authenticate with GCP service account key
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ inputs.service_account_json }}'


    - name: Select Firebase Project
      if: ${{ inputs.project_id }}
      shell: bash
      run: |
        firebase use ${{ inputs.project_id }} --non-interactive

    - name: Deploy Firebase Resources
      shell: bash
      run: |
        ${{ inputs.deploy_command }}

    - name: Post-deployment summary
      shell: bash
      run: |
        echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
        echo "* **Project**: ${{ inputs.project_id }}" >> $GITHUB_STEP_SUMMARY
        echo "* **Deploy Command**: ${{ inputs.deploy_command }}" >> $GITHUB_STEP_SUMMARY
        echo "* **Functions Directory**: ${{ inputs.functions_dir }}" >> $GITHUB_STEP_SUMMARY
